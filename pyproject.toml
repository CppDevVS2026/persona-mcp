[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-mcp"
version = "1.0.0"
description = "An MCP server that acts as a realistic person — friend, teacher, or mentor — with persistent memory and emotional awareness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CppDevVS2026" }]
keywords = ["mcp", "persona", "ai", "chatbot", "friend", "teacher", "mentor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
persona-mcp = "persona_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
